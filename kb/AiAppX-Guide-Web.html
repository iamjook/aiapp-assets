<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080f1e">
  <title>คู่มือการใช้งาน AiAppX</title>
  <style>
    :root{color-scheme:dark;--bg:#080f1e;--panel:#0a1428;--line:#273751;--gold:#e9bd28;--text:#eaf1fc;--muted:#9fb0c8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .page{max-width:1800px;margin:auto;padding:22px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}.brand-mark{display:grid;place-items:center;min-width:112px;height:46px;padding:0 12px;border:1px solid #80671f;border-radius:12px;background:linear-gradient(135deg,#152746,#090f1e);color:#f5cc3b;font-size:24px;font-weight:950;font-style:italic;letter-spacing:-1.5px}.brand h1{margin:0;font-size:23px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .download{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid #846d25;border-radius:9px;background:linear-gradient(135deg,#fff0a5,#d1a82b);color:#151b2a;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}
    .layout{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:18px;height:calc(100vh - 124px);min-height:500px;padding-top:18px}
    .sidebar{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .sidebar-title{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #22314a}.book{display:grid;place-items:center;width:38px;height:38px;border:1px solid #947522;border-radius:9px;background:#332c19;color:#f1c438;font-size:24px}.sidebar-title strong,.sidebar-title small{display:block}.sidebar-title small{color:#d0a726;font-size:9px;letter-spacing:1.4px;font-weight:800}
    .refresh{margin-left:auto;width:34px;height:34px;border:1px solid #6e5a23;border-radius:8px;background:#101c30;color:var(--gold);font-size:20px}.search{display:flex;align-items:center;gap:8px;margin:12px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#080f1e;color:#8493aa}.search input{width:100%;padding:9px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
    .list{display:flex;flex:1;flex-direction:column;gap:5px;overflow:auto;padding:0 8px 12px}.item{display:grid;grid-template-columns:22px minmax(0,1fr) 16px;align-items:center;gap:7px;min-height:36px;padding:6px 10px;border:1px solid #1d2b41;border-radius:11px;background:#101c30;color:#b8c5d8;text-align:left;font-size:12px}.item:hover,.item.selected{border-color:#c7a124;background:#302d21;color:#ffe274}.item.selected{box-shadow:inset 0 0 0 1px #7e681f}.item .icon{font-size:19px;color:var(--gold)}.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .arrow{color:#d6ad23;text-align:right;font-size:22px}.sidebar-footer{display:flex;justify-content:space-between;gap:6px;padding:10px 12px;border-top:1px solid #1e2b40;color:#72819a;font-size:10px}.sidebar-footer span:last-child{color:#c09a27}
    .viewer{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.current{display:flex;align-items:center;gap:9px;min-width:0}.current strong{overflow:hidden;color:#e7bd35;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.badge{padding:2px 7px;border:1px solid #17634f;border-radius:6px;background:#0b2828;color:#59d6a4;font-size:9px}.zoom{display:flex;align-items:center;gap:5px;flex-shrink:0}.zoom button{min-width:34px;height:34px;padding:4px 8px;border:0;border-radius:8px;background:#182238;color:#f4f6fb}.zoom button:hover{background:#283650;color:#f0c637}.zoom span{min-width:42px;text-align:center;color:#b5bfd0;font-size:11px}
    .stage{position:relative;display:flex;flex:1;align-items:flex-start;justify-content:center;min-height:0;overflow:auto;padding:4px;border-radius:15px}.media{display:block;max-width:100%;max-height:none;border:0;border-radius:12px;background:#fff;object-fit:contain;transform-origin:top center}.media.video{width:min(100%,1200px);max-height:calc(100vh - 190px);background:#05070b}.media.frame{width:min(100%,1200px);height:min(72vh,820px);min-height:360px;border-radius:12px;background:#fff}.media.image{width:auto;height:auto}.empty{margin:auto;color:var(--muted);text-align:center}.error{color:#ff9898}.loading{color:var(--muted)}
    @media(max-width:760px){.page{padding:12px}.header{align-items:flex-start}.brand{gap:8px}.brand-mark{min-width:78px;height:38px;padding:0 8px;font-size:20px}.brand h1{font-size:18px}.brand p{font-size:11px}.download{padding:8px;font-size:11px}.layout{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 105px);gap:10px}.sidebar{height:34vh;min-height:210px}.viewer{height:60vh;min-height:360px}.toolbar{min-height:50px}.media.frame{height:50vh;min-height:260px}.media.video{max-height:50vh}}
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-label="AiAppX">AiAppX</span><div><h1>คู่มือการใช้งาน AiAppX</h1><p>ข้อมูลและสื่อแนะนำการใช้งาน AiAppX</p></div></div>
      <a id="download" class="download" hidden target="_blank" rel="noopener noreferrer" download>⬇ ดาวน์โหลด AiAppX Extension</a>
    </header>
    <section class="layout">
      <aside class="sidebar">
        <div class="sidebar-title"><span class="book" aria-hidden="true">▣</span><div><strong>คู่มือ AIAPPX</strong><small>MEDIA EXPLORER</small></div><button id="refresh" class="refresh" title="โหลดคู่มือใหม่" aria-label="โหลดคู่มือใหม่">↻</button></div>
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="ค้นหาหัวข้อสื่อ..."></label>
        <nav id="list" class="list" aria-label="รายการหัวข้อคู่มือ"></nav>
        <div class="sidebar-footer"><span id="count">กำลังโหลดรายการ</span><span>Responsive View</span></div>
      </aside>
      <section class="viewer" aria-label="สื่อคู่มือ">
        <div class="toolbar"><div class="current"><strong id="title">-- เริ่มต้น --</strong><span id="type" class="badge">MEDIA</span></div><div class="zoom"><button id="minus" aria-label="ย่อ">−</button><span id="scale">100%</span><button id="plus" aria-label="ขยาย">＋</button><button id="reset" aria-label="ขนาดปกติ">⛶</button></div></div>
        <div id="stage" class="stage"><div class="empty loading">กำลังโหลดข้อมูลคู่มือ…</div></div>
      </section>
    </section>
  </main>
  <script>
  (()=>{
    'use strict';
    const DATA_URL='https://huggingface.co/datasets/jojosang/AiApp/resolve/main/aiappx_kb.json';
    const $=id=>document.getElementById(id); let items=[],sourcePath='',allowed=new Set(),selected=-1,scale=1;
    const imageTypes=new Set(['jpg','jpeg','png','webp','gif','bmp','avif']);
    const videoTypes=new Set(['mp4','webm','avi','mpeg','mpg','mov']);
    function ext(url){try{return new URL(url,location.href).pathname.split('/').pop().split('.').pop().toLowerCase()}catch{return ''}}
    function youtubeId(raw){try{const u=new URL(raw);const host=u.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';else if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host)){const p=u.pathname.split('/').filter(Boolean);id=u.pathname==='/watch'?u.searchParams.get('v')||'':['embed','shorts','live'].includes(p[0])?p[1]||'':''}return /^[\w-]{6,20}$/.test(id)?id:''}catch{return ''}}
    function mediaUrl(item){const value=String(item.image||'').trim();if(/^https?:\/\//i.test(value))return value;return sourcePath?sourcePath.replace(/\/+$/,'')+'/'+encodeURIComponent(value.replace(/^\/+/,'')):value}
    function driveUrl(raw){return String(raw||'').replace(/\/file\/d\/([^/]+)\/(?:view|edit)(?:\?.*)?$/i,'/file/d/$1/preview')}
    function kind(item){if(item.yt&&youtubeId(item.yt))return 'YOUTUBE';const e=ext(mediaUrl(item));if(item.image&&allowed.has(e)&&(imageTypes.has(e)||videoTypes.has(e)))return videoTypes.has(e)?'VIDEO':e.toUpperCase();if(item.gdrive)return 'GDRIVE';return 'MEDIA'}
    function applyZoom(){ $('scale').textContent=Math.round(scale*100)+'%';const el=$('stage').querySelector('.media');if(el)el.style.transform='scale('+scale+')' }
    function select(index){if(index<0||index>=items.length)return;selected=index;const item=items[index];$('title').textContent=item.name;$('type').textContent=kind(item);renderList();const stage=$('stage');stage.replaceChildren();scale=1;applyZoom();
      const id=item.yt&&youtubeId(item.yt);let el;
      if(id){el=document.createElement('iframe');el.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0';el.title=item.name;el.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';el.allowFullscreen=true;el.referrerPolicy='strict-origin-when-cross-origin';el.className='media frame'}
      else if(item.image&&videoTypes.has(ext(mediaUrl(item)))&&allowed.has(ext(mediaUrl(item)))){el=document.createElement('video');el.src=mediaUrl(item);el.controls=true;el.playsInline=true;el.preload='metadata';el.className='media video'}
      else if(item.image&&imageTypes.has(ext(mediaUrl(item)))&&allowed.has(ext(mediaUrl(item)))){el=document.createElement('img');el.src=mediaUrl(item);el.alt=item.name;el.className='media image';el.addEventListener('error',()=>showMediaError('โหลดรูปภาพไม่สำเร็จ'))}
      else if(item.gdrive){el=document.createElement('iframe');el.src=driveUrl(item.gdrive);el.title=item.name;el.allow='autoplay';el.allowFullscreen=true;el.referrerPolicy='strict-origin-when-cross-origin';el.className='media frame'}
      else{showMediaError('ไม่มีไฟล์สื่อที่รองรับสำหรับหัวข้อนี้');return}stage.append(el);stage.scrollTop=0;
    }
    function showMediaError(message){const node=document.createElement('div');node.className='empty error';node.textContent=message;$('stage').replaceChildren(node)}
    function renderList(){const q=$('search').value.trim().toLowerCase();const list=$('list');list.replaceChildren();let visible=0;items.forEach((item,index)=>{if(q&&!item.name.toLowerCase().includes(q))return;visible++;const b=document.createElement('button');b.type='button';b.className='item'+(index===selected?' selected':'');b.title=item.name;const icon=document.createElement('span');icon.className='icon';icon.textContent=kind(item)==='VIDEO'||kind(item)==='YOUTUBE'||kind(item)==='GDRIVE'?'▶':'▧';const name=document.createElement('span');name.className='name';name.textContent=item.name;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';b.append(icon,name,arrow);b.addEventListener('click',()=>select(index));list.append(b)});$('count').textContent='ทั้งหมด '+visible+' / '+items.length+' รายการ'}
    async function load(){ $('count').textContent='กำลังโหลดรายการ';$('stage').innerHTML='<div class="empty loading">กำลังโหลดข้อมูลคู่มือ…</div>';try{const response=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store',credentials:'omit'});if(!response.ok)throw new Error('โหลดข้อมูลไม่ได้ ('+response.status+')');const json=await response.json();sourcePath=typeof json.path==='string'?json.path:'';allowed=new Set(Array.isArray(json.allow)?json.allow.map(x=>String(x).toLowerCase()):typeof json.allow==='string'?json.allow.split(',').map(x=>x.trim().toLowerCase()):[]);items=Array.isArray(json.items)?json.items.filter(x=>x&&typeof x.name==='string'&&(typeof x.image==='string'||typeof x.gdrive==='string'||typeof x.yt==='string')):[];const download=$('download');if(typeof json.source==='string'&&/^https:\/\//i.test(json.source)){download.href=json.source;download.hidden=false}else download.hidden=true;if(!items.length)throw new Error('ยังไม่มีรายการในไฟล์คู่มือ');selected=0;renderList();select(0)}catch(error){$('count').textContent='โหลดข้อมูลไม่สำเร็จ';$('stage').innerHTML='';const node=document.createElement('div');node.className='empty error';node.textContent=(error&&error.message)||'ไม่สามารถโหลดข้อมูลคู่มือจาก Hugging Face';$('stage').append(node)}}
    $('search').addEventListener('input',renderList);$('refresh').addEventListener('click',load);$('minus').addEventListener('click',()=>{scale=Math.max(.25,scale-.1);applyZoom()});$('plus').addEventListener('click',()=>{scale=Math.min(3,scale+.1);applyZoom()});$('reset').addEventListener('click',()=>{scale=1;applyZoom()});load();
  })();
  </script>
</body>
</html>
